name: CRM customer save safety
on:
  pull_request:
    paths:
      - 'src/components/crm/**'
      - 'src/lib/crm/**'
      - '.github/workflows/crm-save-safety.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/crm/**'
      - 'src/lib/crm/**'
      - '.github/workflows/crm-save-safety.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test CRM receipt, authorization and history
        run: bunx vitest run src/lib/crm/saveRecovery.test.ts src/lib/crm/classification.test.ts src/lib/crm/fields.test.ts src/lib/crm/logic.test.ts src/lib/crm/database.test.ts
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
