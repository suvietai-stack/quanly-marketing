name: Inbox validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/lib/inbox/**'
      - 'src/components/inbox/**'
      - 'src/components/FbLeadsSettings.tsx'
      - 'src/lib/fbLeads/**'
      - 'src/routes/inbox.tsx'
      - 'src/lib/navigation.ts'
      - 'src/lib/auth.ts'
      - 'docs/inbox-2026-11-15/**'
      - 'vitest.inbox.config.ts'
      - '.github/workflows/inbox-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - run: bun install --frozen-lockfile
      - name: Production build and route generation
        run: bun run build
      - run: bunx tsc --noEmit
      - name: Semantic lint
        run: >-
          bunx eslint src/components/inbox src/lib/inbox src/routes/inbox.tsx src/lib/fbLeads/fb.server.ts src/lib/fbLeads/fb.functions.ts src/lib/fbLeads/pageDiscovery.server.ts src/components/FbLeadsSettings.tsx
          --rule 'prettier/prettier: off' --rule '@typescript-eslint/no-explicit-any: off'
      - run: bunx vitest run --config vitest.inbox.config.ts
