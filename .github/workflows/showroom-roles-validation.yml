name: Showroom roles validation

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/showroom/**'
      - 'src/components/BaseOrganization.tsx'
      - 'src/components/OrgUnitDrawer.tsx'
      - 'drizzle/migrations/0388_showroom_position_roles.sql'
      - '.github/workflows/showroom-roles-validation.yml'
  pull_request:
    paths:
      - 'src/lib/showroom/**'
      - 'src/components/BaseOrganization.tsx'
      - 'src/components/OrgUnitDrawer.tsx'
      - 'drizzle/migrations/0388_showroom_position_roles.sql'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/showroom/positionSetup.test.ts
      - run: bunx tsc --noEmit
