name: Design workflow v2 validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/components/Design*.tsx'
      - 'src/components/OrderDetail.tsx'
      - 'src/components/PermissionChecklist.tsx'
      - 'src/components/AppShell.tsx'
      - 'src/components/AppNavigation.tsx'
      - 'src/components/MobileAppChrome.tsx'
      - 'src/components/MobileLauncher.tsx'
      - 'src/components/DesignWorkflowSummary.tsx'
      - 'src/styles.css'
      - 'tests/design.browser.tsx'
      - 'tests/designMobile.browser.py'
      - 'src/components/VideoDetail.tsx'
      - 'src/lib/orders/**'
      - 'src/lib/navigation*'
      - 'src/lib/store.ts'
      - 'drizzle/migrations/0420_design_workflow_v2_zalo_groups.sql'
      - 'drizzle/migrations/0440_design_v2_performance.sql'
      - '.github/workflows/design-workflow-validation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Design and navigation regression
        run: bunx vitest run src/lib/orders/design.test.ts src/lib/orders/workboard.test.ts src/lib/orders/zaloGroupMessage.test.ts src/lib/navigation.test.ts
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build
      - name: Install Playwright for real mobile viewports
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Start isolated Design UI test server
        run: |
          (bun run dev -- --host 0.0.0.0 --port 8080 > /tmp/design-vite.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/design-vite.log
          exit 1
      - name: Mobile viewport check 320-430px (no live Job writes)
        run: python tests/designMobile.browser.py
      - name: Attach mobile screenshots if browser test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-mobile-screenshots
          path: /tmp/browser/design-mobile/
          if-no-files-found: ignore
