name: Production shared supplier master smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supplier-production-smoke.yml'
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect live and custom domains without assuming SPA fallback
        run: |
          set -uo pipefail
          mkdir -p /tmp/supplier-smoke
          for origin in https://base.suviet.vn https://quanly-suviet.lovable.app; do
            echo "=== ORIGIN ${origin} ==="
            for path in / /k3-center /procurement/suppliers; do
              curl -sSL --compressed --max-time 30 -D /tmp/supplier-smoke/headers                 -o /tmp/supplier-smoke/body -w "GET ${path} HTTP=%{http_code} URL=%{url_effective}\n"                 "${origin}${path}" || true
              grep -iE '^(x-deployment-id:|location:|HTTP/)' /tmp/supplier-smoke/headers | tail -n 6 || true
              if [ "${path}" = "/" ]; then cp /tmp/supplier-smoke/body /tmp/supplier-smoke/root.html; fi
            done
            grep -aoE '/assets/[^" ]+\.js' /tmp/supplier-smoke/root.html               | sort -u > /tmp/supplier-smoke/assets.txt || true
            echo "JS asset links: $(wc -l < /tmp/supplier-smoke/assets.txt)"
            while IFS= read -r asset; do
              curl -sSL --compressed --max-time 20 "${origin}${asset}"                 -o /tmp/supplier-smoke/js || continue
              if grep -aFq '/procurement/suppliers' /tmp/supplier-smoke/js; then
                echo "PASS: live JS contains new procurement supplier URL on ${origin}"
                exit 0
              fi
            done < /tmp/supplier-smoke/assets.txt
          done
          echo 'FAIL: neither production domain confirmed the new supplier route.'
          exit 1
