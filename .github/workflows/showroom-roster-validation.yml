name: Showroom weekly roster validation
on:
  push:
    branches: [main]
    paths:
      - 'src/components/showroom/ShiftRosterPage.tsx'
      - 'src/lib/showroom/shifts*'
      - 'src/routes/showroom_.shifts.tsx'
      - 'src/lib/aiSuviet/guides*'
      - 'src/components/ai/ChipiAiPanel.tsx'
      - 'src/lib/auth.ts'
      - 'src/lib/navigation.ts'
      - 'src/routeTree.gen.ts'
      - '.github/workflows/showroom-roster-validation.yml'
  pull_request:
    paths:
      - 'src/components/showroom/ShiftRosterPage.tsx'
      - 'src/lib/showroom/shifts*'
      - 'src/routes/showroom_.shifts.tsx'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/showroom/shifts.test.ts src/lib/aiSuviet/guides.test.ts src/lib/navigation.test.ts
      - run: bunx tsc --noEmit
      - run: bun run build
