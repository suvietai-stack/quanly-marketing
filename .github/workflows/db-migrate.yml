name: DB migrate (Lovable Cloud -> Supabase)
# Manual only. Secrets are entered by the owner in GitHub:
#   MIGRATION_BACKUP_URL     temporary download link of the Lovable export
#   MIGRATION_TARGET_DB_URL  connection string of the NEW, empty Supabase project
# The backup is never uploaded as an artifact or committed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect (read backup only) or restore (write into new Supabase)'
        required: true
        default: inspect
        type: choice
        options: [inspect, restore, cron]
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Download backup
        env:
          MIGRATION_BACKUP_URL: ${{ secrets.MIGRATION_BACKUP_URL }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/db.download" "$MIGRATION_BACKUP_URL"
          ls -lh "$RUNNER_TEMP/db.download"; sha256sum "$RUNNER_TEMP/db.download"
          # Lovable's export download comes wrapped in a .zip: unpack it if so.
          if head -c 4 "$RUNNER_TEMP/db.download" | grep -q $'PK\x03\x04'; then
            mkdir -p "$RUNNER_TEMP/db-unzip"
            unzip -o -q "$RUNNER_TEMP/db.download" -d "$RUNNER_TEMP/db-unzip"
            find "$RUNNER_TEMP/db-unzip" -type f -exec ls -l {} \;
            f=$(find "$RUNNER_TEMP/db-unzip" -type f -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
            mv "$f" "$RUNNER_TEMP/db.backup"
            rm -rf "$RUNNER_TEMP/db-unzip" "$RUNNER_TEMP/db.download"
          else
            mv "$RUNNER_TEMP/db.download" "$RUNNER_TEMP/db.backup"
          fi
          head -c 5 "$RUNNER_TEMP/db.backup" | grep -q PGDMP || { echo "Not a pg custom-format backup"; exit 1; }
          ls -lh "$RUNNER_TEMP/db.backup"; sha256sum "$RUNNER_TEMP/db.backup"
      - name: Inspect / restore
        env:
          BACKUP_FILE: ${{ runner.temp }}/db.backup
          TARGET_DB_URL: ${{ secrets.MIGRATION_TARGET_DB_URL }}
          OUT_DIR: ${{ runner.temp }}
        run: scripts/db-migrate/restore.sh "${{ inputs.mode }}"
      - name: Remove backup from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/db.backup" "$RUNNER_TEMP/db.download" "$RUNNER_TEMP/db-unzip"
