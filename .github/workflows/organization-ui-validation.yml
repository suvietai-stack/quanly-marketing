name: Organization UI validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/components/OrgChart.tsx'
      - 'src/components/BaseOrganization.tsx'
      - 'src/lib/orgChart.ts'
      - 'src/lib/orgCenters.ts'
      - 'src/lib/basePermissions/centerPositions.ts'
      - 'src/lib/basePermissions/centerPositions.test.ts'
      - 'src/lib/basePermissions/centerRoleDefaults.ts'
      - 'src/lib/basePermissions/completeCenterRoles.database.test.ts'
      - 'docs/center-roles-2026-11-17/**'
      - 'src/lib/distribution/**'
      - '.github/workflows/organization-ui-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  organization-ui:
    runs-on: ubuntu-latest
    env:
      # Vite/React production bundle exceeds Node's default ~2GiB heap on GitHub runners.
      NODE_OPTIONS: --max-old-space-size=4096
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - run: bun install --frozen-lockfile
      - name: Build and regenerate route types
        run: bun run build
      - run: bunx tsc --noEmit
      - run: >-
          bunx eslint src/components/OrgChart.tsx src/components/BaseOrganization.tsx --rule 'prettier/prettier: off' --rule '@typescript-eslint/no-explicit-any: off'
      - run: >-
          bunx vitest run src/lib/orgChart.test.ts
          src/lib/basePermissions/centerPositions.test.ts
          src/lib/basePermissions/completeCenterRoles.database.test.ts
          src/lib/distribution/hierarchy.test.ts
          src/lib/distribution/centersHierarchy.test.ts
