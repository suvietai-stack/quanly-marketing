name: Dashboard validation
on:
  push:
    branches: [main]
    paths:
      - 'src/routes/index.tsx'
      - 'src/styles.css'
      - 'src/components/kpi/PersonalKpi.tsx'
      - '.github/workflows/dashboard-validation.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/routes/index.tsx'
      - 'src/styles.css'
      - 'src/components/kpi/PersonalKpi.tsx'
      - '.github/workflows/dashboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      # The existing codebase has a large formatting/no-explicit-any backlog.
      # Keep all other ESLint correctness rules active for this UI change.
      - name: Dashboard semantic lint (baseline exclusions)
        run: bunx eslint src/routes/index.tsx src/components/kpi/PersonalKpi.tsx --rule 'prettier/prettier: off' --rule '@typescript-eslint/no-explicit-any: off'
      - name: Production build
        run: bun run build
