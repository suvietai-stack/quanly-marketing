name: Dashboard validation
on:
  pull_request:
    paths:
      - 'src/routes/index.tsx'
      - 'src/styles.css'
      - 'src/components/kpi/PersonalKpi.tsx'
      - '.github/workflows/dashboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Dashboard lint
        run: bunx eslint src/routes/index.tsx src/components/kpi/PersonalKpi.tsx
      - name: Production build
        run: bun run build
