name: Read-only Base authentication connectivity diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/auth-connectivity-diagnostic.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public web and Supabase health endpoints without credentials
        shell: bash
        run: |
          set +e
          set -u
          urls=(
            'https://base.suviet.vn/login'
            'https://quanly-suviet.lovable.app/login'
            'https://vipbucgcgkvuvzgqpftp.supabase.co/auth/v1/health'
            'https://vipbucgcgkvuvzgqpftp.supabase.co/rest/v1/'
            'https://supabase.co/'
          )
          for url in "${urls[@]}"; do
            echo "=== PROBE: ${url} ==="
            outcome=$(curl --compressed --silent --show-error --location \
              --connect-timeout 10 --max-time 35 --retry 1 \
              --output /dev/null --write-out \
              'http=%{http_code} ip=%{remote_ip} tls=%{ssl_verify_result} seconds=%{time_total} redirect=%{url_effective}' \
              "${url}" 2>&1)
            ec=$?
            echo "curl_exit=${ec} ${outcome}"
            echo
          done
          echo '=== DNS CROSS-CHECK ==='
          for name in base.suviet.vn supabase.co vipbucgcgkvuvzgqpftp.supabase.co; do
            echo "Name: ${name}"
            getent ahostsv4 "${name}" | head -n 2 || true
            echo 'Cloudflare:'
            dig +time=5 +tries=1 @1.1.1.1 "${name}" A +short || true
            echo 'Google DNS:'
            dig +time=5 +tries=1 @8.8.8.8 "${name}" A +short || true
          done
          echo '=== PUBLISHED LOGIN JS SUPABASE HOST CHECK ==='
          curl -fsSL --compressed --max-time 40 https://base.suviet.vn/login -o /tmp/live-login.html
          if grep -aFq 'vipbucgcgkvuvzgqpftp.supabase.co' /tmp/live-login.html; then
            echo 'FOUND: dead Supabase hostname embedded in published HTML'
          fi
          grep -aoE '/assets/[^" ]+\\.js' /tmp/live-login.html | sort -u > /tmp/login-js-paths || true
          echo "JavaScript asset count: $(wc -l </tmp/login-js-paths)"
          hit=0
          while IFS= read -r js; do
            curl -fsSL --compressed --max-time 15 "https://base.suviet.vn${js}" -o /tmp/live-asset.js || continue
            if grep -aFq 'vipbucgcgkvuvzgqpftp.supabase.co' /tmp/live-asset.js; then
              echo "FOUND: published JavaScript points to dead Supabase hostname in ${js}"
              hit=1
            fi
          done </tmp/login-js-paths
          echo "live_compiled_hostname_found=${hit}"
          echo 'Diagnostic only: no credentials, no authentication attempt, no database writes, no deployment.'
