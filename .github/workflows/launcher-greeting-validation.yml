name: Launcher greeting validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/lib/launcherGreeting.ts'
      - 'src/lib/launcherGreeting.test.ts'
      - 'src/components/MobileLauncher.tsx'
      - 'src/styles.css'
      - '.github/workflows/launcher-greeting-validation.yml'

permissions:
  contents: read

jobs:
  launcher-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Time-based greeting unit tests
        run: bunx vitest run src/lib/launcherGreeting.test.ts
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
