name: Sứ Việt internal community checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/lib/community/**'
      - 'src/components/community/**'
      - 'src/components/MobileAppChrome.tsx'
      - 'src/routes/community.tsx'
      - 'src/routes/profile.tsx'
      - 'src/lib/navigation.ts'
      - 'supabase/migrations/20261114010000_community_private.sql'
      - '.github/workflows/community-validation.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Community unit tests
        run: bunx vitest run src/lib/community/api.test.ts
      # TanStack Router generates routeTree.gen.ts during Vite build; compile
      # the new /community route before validating its typed links.
      - name: Production build
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
