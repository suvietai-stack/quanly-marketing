name: AZDIGI hosting build
# Builds a Node.js (Nitro node-server) bundle for AZDIGI cPanel hosting.
# Lovable/Cloudflare publishing is not touched by this workflow.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/azdigi-deploy.yml'
      - 'deploy/azdigi/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: azdigi-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.19'
      - run: bun install --frozen-lockfile
      - name: Build Node server bundle
        env:
          NITRO_PRESET: node-server
        run: bun run build
      - name: Assemble hosting bundle
        run: |
          test -f .output/server/index.mjs
          cp deploy/azdigi/app.cjs .output/app.cjs
          echo "${GITHUB_SHA}" > .output/BUILD_SHA
          du -sh .output
      - name: Smoke test bundle with Node 22
        run: |
          PORT=3999 node .output/server/index.mjs > /tmp/base.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:3999/ && break; sleep 1; done
          curl -fsS -o /dev/null -w "home %{http_code}\n" http://127.0.0.1:3999/
          curl -sS -o /dev/null -w "wf ping %{http_code}\n" http://127.0.0.1:3999/api/public/wf/ping || true
          kill %1 || true
          tail -20 /tmp/base.log
      - name: Publish bundle to deploy-azdigi branch
        if: github.event_name != 'pull_request'
        run: |
          cd .output
          git init -q -b deploy-azdigi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" deploy-azdigi
      - name: Deploy to AZDIGI over SSH
        if: github.event_name != 'pull_request' && env.AZDIGI_SSH_KEY != ''
        env:
          AZDIGI_SSH_KEY: ${{ secrets.AZDIGI_SSH_KEY }}
          AZDIGI_SSH_HOST: ${{ secrets.AZDIGI_SSH_HOST }}
          AZDIGI_SSH_PORT: ${{ secrets.AZDIGI_SSH_PORT }}
          AZDIGI_SSH_USER: ${{ secrets.AZDIGI_SSH_USER }}
          AZDIGI_APP_DIR: ${{ secrets.AZDIGI_APP_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AZDIGI_SSH_KEY" > ~/.ssh/azdigi && chmod 600 ~/.ssh/azdigi
          PORT_ARG="${AZDIGI_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT_ARG" "$AZDIGI_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/azdigi -p $PORT_ARG"
          rsync -az --delete --exclude tmp/ --exclude .htaccess --exclude 'stderr.log' -e "$SSH" .output/ "$AZDIGI_SSH_USER@$AZDIGI_SSH_HOST:$AZDIGI_APP_DIR/"
          $SSH "$AZDIGI_SSH_USER@$AZDIGI_SSH_HOST" "mkdir -p '$AZDIGI_APP_DIR/tmp' && touch '$AZDIGI_APP_DIR/tmp/restart.txt'"
